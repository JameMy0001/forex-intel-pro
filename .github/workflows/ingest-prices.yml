name: Ingest Real-time Prices & Signals 24/7

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-cloud-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Cloud Ingestion API
        run: |
          echo "Triggering live ingestion endpoint on Vercel..."
          RESPONSE=$(curl -s -w "\n%{http_code}" https://1intel-pro-jame.vercel.app/api/ingestion/trigger)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Ingestion request failed with status $HTTP_CODE"
            exit 1
          fi
